<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sorteo de Navidad FuturMovil</title>
<meta name="description" content="Elige tu número del 01 al 00. Gana la terminación del Gordo de Navidad.">
<meta name="theme-color" content="#0f3d2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorteo">
<meta property="og:title" content="Sorteo de Navidad FuturMovil">
<meta property="og:description" content="Elige tu número del 01 al 00. Gana la terminación del Gordo.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
/* Décimo navideño: billete de lotería verdoso dentro de un marco de bastón de caramelo, sobre noche verde con nieve. Móvil en columna; en PC el décimo se abre en dos columnas (premio a la izquierda, tablero a la derecha). */
:root{
  --night:#0f3d2b;--night2:#1b6a4a;
  --paper:#e6f0ea;--paper2:#f4f9f6;--paperdk:#c9d8cf;
  --ink:#14233b;--red:#c8102e;--blue:#1c4f8c;--gold:#f6c744;--holly:#1fa66a;--muted:#5b6f66;
  --fd:'Alfa Slab One',Georgia,serif;--fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,var(--night2),var(--night) 70%) fixed,var(--night);color:var(--ink);font:14px/1.5 var(--fm);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#snow,#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:1}#conf{z-index:80}
.defs{position:absolute;width:0;height:0}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-width:1040px;margin:0 auto;padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.35);border:1px solid rgba(246,199,68,.35);border-radius:10px;padding:3px;flex:1 1 260px}
.seg button{flex:1;border:0;background:transparent;color:#cfe7d8;border-radius:8px;padding:8px 6px;font-weight:700;font-size:13px}
.seg button.on{background:var(--gold);color:#2a1f00}
.ib{background:rgba(0,0,0,.35);border:1px solid rgba(246,199,68,.35);color:#ffe9a8;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700}
.ib.off{opacity:.6;text-decoration:line-through}

.wrapall{position:relative;z-index:2;max-width:1040px;margin:0 auto}

/* adornos colgando */
.hang{display:flex;justify-content:space-around;align-items:flex-start;height:84px;padding:0 6px;margin-bottom:4px}
.orn{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite alternate}
.orn:nth-child(2n){animation-duration:2.6s;animation-delay:-.8s}.orn:nth-child(3n){animation-duration:3.8s;animation-delay:-1.6s}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.orn i{display:block;width:1px;background:#e8dcb0;height:var(--s)}
.ball{border-radius:50%;position:relative;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85) 0 7%,transparent 9%),radial-gradient(circle at 36% 32%,var(--l),var(--c) 52%,var(--d))}
.ball::before{content:"";position:absolute;top:-7px;left:50%;width:10px;height:8px;transform:translateX(-50%);background:linear-gradient(90deg,#b8860b,#ffe08a,#b8860b);border-radius:2px 2px 0 0}
.k1{--l:#ff8d9b;--c:#d4142f;--d:#6d0415}.k2{--l:#fff0b5;--c:#f6c744;--d:#8a6100}.k3{--l:#cfe9ff;--c:#6aa8e8;--d:#1c4d8c}.k4{--l:#9af0c1;--c:#1fa66a;--d:#0a4f31}

/* marco de bastón + décimo */
.cfr{padding:10px;border-radius:14px;background:repeating-linear-gradient(45deg,#d4142f 0 12px,#fff 12px 24px);box-shadow:0 14px 30px rgba(0,0,0,.35);position:relative}
.holly{position:absolute;width:64px;height:44px;z-index:3}
.holly.a{left:-10px;bottom:-14px}.holly.c{right:-10px;top:-12px;transform:scaleX(-1) rotate(8deg)}
.t{background:var(--paper);border-radius:6px;padding:20px clamp(14px,3vw,28px) 18px;position:relative;min-width:0}
.t::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(20,35,59,.018) 3px 4px)}
.tline{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.1em;border-bottom:2px solid var(--ink);padding-bottom:6px;flex-wrap:wrap}
.head{display:flex;gap:14px;align-items:center;margin:14px 0 4px}
.logo{width:56px;height:56px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font:400 clamp(28px,7vw,48px)/.95 var(--fd);color:var(--red);text-transform:uppercase;text-wrap:balance}
.rng{font-weight:600;font-size:12px;letter-spacing:.2em;margin:6px 0 14px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.grid2{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:26px;align-items:start}.grid2>.colL{border-right:2px dashed var(--ink);padding-right:26px}}
.colL,.colR{min-width:0;display:grid;gap:12px;align-content:start}
.pr{border:2px solid var(--ink);display:grid;grid-template-columns:auto 1fr}
.pr>span{background:var(--ink);color:var(--paper);padding:10px 10px;font-size:11px;letter-spacing:.2em;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-weight:700}
.pr>div{padding:10px 14px;min-width:0}
.pr b{font:400 clamp(22px,4.6vw,30px)/1.1 var(--fd);display:block;overflow-wrap:anywhere}
.pr small{display:block;color:var(--muted)}
.price{display:inline-flex;gap:6px;align-items:baseline;margin-top:6px;border:1.5px solid var(--red);color:var(--red);padding:1px 10px;font-weight:700}
.price strong{font:400 20px var(--fd)}
.lbl{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;border:2px solid var(--ink)}
.cd>div{padding:8px 0}.cd>div+div{border-left:1px solid var(--ink)}
.cd b{display:block;font:700 clamp(20px,5vw,28px)/1.1 var(--fm);font-variant-numeric:tabular-nums}
.cd span{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.how{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.prog{height:8px;border:1.5px solid var(--ink);background:var(--paper2)}
.prog i{display:block;height:100%;background:var(--red)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(3px,1vw,7px)}
.b{aspect-ratio:1;max-width:100%;padding:0;background:var(--paper2);border:1px solid var(--ink);font:600 clamp(10px,2.8vw,15px) var(--fm);color:var(--ink);position:relative;transition:transform .12s}
.b:hover{background:var(--ink);color:#fff}
.b.res{border:2px dashed var(--blue);color:var(--blue);background:var(--paper)}
.b.ven{background:repeating-linear-gradient(-45deg,var(--paperdk) 0 3px,var(--paper) 3px 6px);color:#7f9388;border-color:#9bb0a4;cursor:default}
.b.res:hover,.b.ven:hover{background:inherit}
.b.res:hover{background:var(--paper);color:var(--blue)}
.b.ven:hover{background:repeating-linear-gradient(-45deg,var(--paperdk) 0 3px,var(--paper) 3px 6px);color:#7f9388}
.b.sel,.b.sel:hover{background:var(--paper);color:var(--red);box-shadow:inset 0 0 0 3px var(--red);transform:rotate(-6deg) scale(1.1);z-index:2}
.b.win{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px var(--red);animation:glow 1s infinite alternate;z-index:2}
@keyframes glow{to{box-shadow:0 0 0 3px var(--red),0 0 18px 6px rgba(246,199,68,.9)}}
.b.mio::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--holly)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
.lgd i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.tray{border-top:2px dashed var(--ink);padding-top:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chips b{background:var(--red);color:#fff;padding:1px 8px;font-size:13px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tot{font:400 26px var(--fd)}
.btn{background:var(--red);color:#fff;border:0;padding:11px 18px;font:400 15px var(--fd);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.1)}
.btn.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.g{background:var(--holly)}
.btn.sm{padding:5px 10px;font-size:12px}
.bars{height:30px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);margin-top:16px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;margin-top:6px;letter-spacing:.06em}
.muted{color:var(--muted);font-size:12px}
.result{border:2px solid var(--red);padding:12px;text-align:center;background:#fff8e1}
.gordo{font:700 clamp(30px,8vw,44px) var(--fm);letter-spacing:.14em}
.gordo u{text-decoration:none;color:var(--red);border-bottom:3px solid var(--red)}

/* admin */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink)}
.tabs button{background:transparent;border:0;padding:9px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tabs button+button{border-left:1px solid var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--ink)}
@media(min-width:600px){.st{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st div{padding:8px 12px;border:1px solid rgba(20,35,59,.25)}
.st b{display:block;font:400 22px var(--fd)}
.st span{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.rw{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--ink);padding:8px 0;flex-wrap:wrap}
.rw .n{font:400 20px var(--fd);color:var(--red);width:34px}
.rw .i{flex:1;min-width:150px}
.rw small{display:block;color:var(--muted)}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:10px}
.in{width:100%;background:var(--paper2);border:1.5px solid var(--ink);padding:9px 11px;margin-top:3px;color:var(--ink);border-radius:0}
select.in option{background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1}
.edit{border:2px solid var(--blue);padding:12px;background:var(--paper2)}

/* diálogos: un trocito de décimo */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,25,16,.8);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dlg{width:100%;max-width:440px;max-height:92vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.92) rotate(-2deg);opacity:0}}
.dlg .t{padding:18px}
.dlg h3{margin:0 0 8px;font:400 26px var(--fd);color:var(--red);text-transform:uppercase}
.intro{text-align:center}
.intro .big{font:400 clamp(30px,9vw,44px)/1 var(--fd);color:var(--red);text-transform:uppercase;margin:8px 0}
.digs{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dg{width:clamp(44px,13vw,60px);height:clamp(62px,17vw,84px);display:grid;place-items:center;font:700 clamp(32px,9vw,50px) var(--fm);background:#fff;border:2px solid var(--ink);font-variant-numeric:tabular-nums}
.dg.fin{border-color:var(--red);color:var(--red);border-width:3px}
.dg.stop{animation:pop .3s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--red);padding:9px 16px;font-weight:700;z-index:90;max-width:90vw;text-align:center}
.demo{position:relative;z-index:2;max-width:1040px;margin:14px auto 0;text-align:center;color:#cfe7d8;font-size:12px}
@media(prefers-reduced-motion:reduce){.orn,.b.win{animation:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.topbar .sp{flex:1}
.topbar{background:var(--night);box-shadow:0 6px 14px rgba(0,0,0,.25);max-width:none;padding-left:max(16px,calc((100vw - 1040px)/2));padding-right:max(16px,calc((100vw - 1040px)/2));margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.ph-size{display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.3;color:var(--muted)}
.ph-size b{display:block;font-size:16px;color:var(--ink)}
.ib.adm{border-color:rgba(255,255,255,.25);color:#cfe7d8}
.loading{text-align:center;padding:60px 0;font-weight:700;letter-spacing:.1em}
.loading i{display:inline-block;width:10px;height:10px;background:var(--red);margin:0 3px;animation:bl 1s infinite alternate}
.loading i:nth-child(2){animation-delay:.2s}.loading i:nth-child(3){animation-delay:.4s}
@keyframes bl{to{opacity:.2}}
.share{display:grid;gap:8px;margin-top:10px}
.share a,.share button{display:block;text-align:center;text-decoration:none;padding:10px;border:2px solid var(--ink);color:var(--ink);font-weight:700;background:var(--paper2)}
.ios{font-size:13px;line-height:1.6}
.sec{border:2px solid var(--ink);padding:12px;display:grid;gap:2px;background:var(--paper2)}
.sec .lbl{color:var(--red);margin-bottom:2px}
.tip{font-size:13px;line-height:1.5;border-left:4px solid var(--gold);background:#fff8e1;padding:8px 10px;margin:4px 0 10px}
.warn{font-size:13px;border-left:4px solid var(--red);background:#fde8eb;padding:8px 10px;margin-bottom:10px}
.okk{font-size:13px;border-left:4px solid var(--holly);background:#e3f6ec;padding:8px 10px;margin-bottom:10px}
.lgrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo.big{width:120px;height:120px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px}
.lgbtns{flex:1;min-width:160px;display:grid;gap:8px}
.modes{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}
.modes button{border:0;background:transparent;padding:8px;font-weight:700}
.modes button.on{background:var(--ink);color:var(--paper)}
.ios b{color:var(--red)}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="holly" viewBox="0 0 60 40"><path d="M30 22C20 6 4 10 2 20c8-2 14 6 28 2z" fill="#1fa66a"/><path d="M30 22C40 6 56 10 58 20c-8-2-14 6-28 2z" fill="#168a57"/><circle cx="26" cy="24" r="5" fill="#d4142f"/><circle cx="34" cy="24" r="5" fill="#d4142f"/><circle cx="30" cy="31" r="5" fill="#e8283f"/></symbol>
</defs></svg>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="conf" aria-hidden="true"></canvas>

<div class="topbar">
  <button class="ib" id="bMus" type="button">Música</button>
  <button class="ib" id="bSfx" type="button">Sonidos</button>
  <span class="sp"></span>
  <button class="ib" id="bInst" type="button">Instalar app</button>
  <button class="ib" id="bShare" type="button">Compartir</button>
  <button class="ib adm" id="bAdm" type="button">Admin</button>
</div>

<div class="wrapall">
  <div class="hang" id="hang" aria-hidden="true"></div>
  <div class="cfr">
    <svg class="holly a" aria-hidden="true"><use href="#holly"/></svg>
    <svg class="holly c" aria-hidden="true"><use href="#holly"/></svg>
    <div class="t" id="main"><div class="loading">CARGANDO EL SORTEO <i></i><i></i><i></i></div></div>
  </div>
</div>
<p class="demo" id="pie">Sorteo de Navidad 2026</p>

<div class="ov" id="ov"><div class="dlg"><div class="cfr"><div class="t intro" id="dlg">
  <div class="tline"><span>LOTERÍA DE NAVIDAD</span><span>22·XII·2026</span></div>
  <div class="big" id="iT">Gran Sorteo de Navidad</div>
  <p>100 números, del 01 al 00. Si tu número termina igual que el Gordo, te llevas el premio.</p>
  <div class="acts"><button class="btn" id="iGo" type="button">Entrar con sonido</button><button class="btn o" id="iNo" type="button">Sin sonido</button></div>
</div></div></div></div>

<script>
var API='https://script.google.com/macros/s/AKfycbyaLjO7lrZktZVERB6Fxvaq8DengZpBiEQSJ96R7iyMWwXbxQSy8i8Klo7g51-PqdX1Ig/exec';
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return (n<10?'0':'')+n};
var eur=function(n){n=Math.round(n*100)/100;return (n%1===0?String(n):n.toFixed(2).replace('.',','))+' €'};
var ls={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var ORDER=[];for(var i=1;i<100;i++)ORDER.push(i);ORDER.push(0);
var MAX=10;

var S={cfg:null,n:{},adm:null,win:null,sel:{},view:'c',tab:'n',edit:null,mios:ls.get('sorteo_mios',{}),token:ls.get('sorteo_tok',''),ver:0,busy:false,lastGordo:null};

function api(action,data){data=data||{};data.action=action;if(S.token&&action!=='estado'&&action!=='reservar'&&action!=='login')data.token=S.token;
 return fetch(API,{method:'POST',body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(j){
  if(!j.ok&&j.error==='SESION'){S.token='';ls.set('sorteo_tok','');S.view='c';render();toast('La sesión de admin ha caducado. Vuelve a entrar.');throw new Error('SESION')}
  return j})}

/* adornos */
$('#hang').innerHTML=[['k1',10,30],['k2',34,36],['k4',16,28],['k3',40,34],['k1',20,30],['k2',6,26],['k4',28,32]].map(function(x){return '<div class="orn"><i style="--s:'+x[1]+'px"></i><div class="ball '+x[0]+'" style="width:'+x[2]+'px;height:'+x[2]+'px"></div></div>'}).join('');

/* nieve */
(function(){var cv=$('#snow'),cx=cv.getContext('2d'),W,H,F=[],red=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:-10,r:Math.random()*3+.8,v:Math.random()*.9+.35,a:Math.random()*6.28,s:Math.random()*.02+.005}}
function init(){W=cv.width=innerWidth;H=cv.height=innerHeight;var n=Math.floor(Math.min(140,W*H/9000)*(red?.3:1));F=[];for(var i=0;i<n;i++)F.push(mk(true))}
function loop(){if(!document.hidden){cx.clearRect(0,0,W,H);cx.fillStyle='#fff';F.forEach(function(f){f.y+=f.v;f.a+=f.s;f.x+=Math.sin(f.a)*.6;if(f.y>H+5){f.y=-8;f.x=Math.random()*W}cx.globalAlpha=.35+f.r/5*.5;cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()})}requestAnimationFrame(loop)}
addEventListener('resize',init);init();loop()})();

/* confeti */
var Conf=(function(){var cv=$('#conf'),cx=cv.getContext('2d'),P=[],run=false,cols=['#c8102e','#f6c744','#1fa66a','#6aa8e8','#fff','#14233b'];
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',size);size();

  api('reservar',{nums:k,nombre:nm,tel:tl,email:em}).then(function(j){S.busy=false;
   if(!j.ok){$('#rE').textContent=j.error;$('#rOk').disabled=false;$('#rOk').textContent='Reservar';Snd.err();if(j.ocupados){j.ocupados.forEach(function(n){delete S.sel[n]});load(false)}return}
   ls.set('sorteo_nom',nm);ls.set('sorteo_tel',tl);ls.set('sorteo_mail',em);
   j.nums.forEach(function(n){S.mios[n]=1;S.n[n]='reservado'});ls.set('sorteo_mios',S.mios);S.sel={};
   Snd.ok();Conf.burst(innerWidth/2,innerHeight/3,90);
   dlg('<h3>Reservado</h3><div class="chips">'+j.nums.map(function(n){return '<b>'+pad(n)+'</b>'}).join('')+'</div><p>Tienes '+j.horas+' horas para pagar <b>'+eur(j.total)+'</b>. Si no se paga en ese plazo, los números vuelven a quedar libres. Cuando recibamos el pago, pasan a vendidos y te llegará un correo de confirmación a <b>'+esc(em)+'</b>.</p><div class="acts"><a class="btn" target="_blank" rel="noopener" href="'+payUrl(j.total)+'">Pagar '+eur(j.total)+' con myPOS</a></div><div class="acts"><button class="btn o" type="button" id="rK">Cerrar</button></div>');$('#rK').onclick=closeDlg;load(false)
  }).catch(function(){S.busy=false;$('#rE').textContent='No se ha podido reservar. Revisa tu conexión y vuelve a intentarlo.';$('#rOk').disabled=false;$('#rOk').textContent='Reservar';Snd.err()})}}

var revT=[];
function clearRev(){revT.forEach(function(t){clearTimeout(t);clearInterval(t)});revT=[]}
function reveal(){var g=S.cfg.gordo;if(!g)return;clearRev();Snd.init();
 dlg('<h3 style="text-align:center">El Gordo de Navidad</h3><div class="digs" id="dgs">'+g.split('').map(function(d,i){return '<div class="dg'+(i>=3?' fin':'')+'">?</div>'}).join('')+'</div><p id="rt" style="text-align:center">Sorteando…</p><div id="rw" style="text-align:center"></div><div class="acts"><button class="btn o" type="button" id="rS">Saltar</button><button class="btn" type="button" id="rX" hidden>Cerrar</button></div>');
 var sp=[].slice.call(document.querySelectorAll('#dgs .dg'));
 function fin(){clearRev();sp.forEach(function(s,i){s.textContent=g[i];s.classList.add('stop')});var w=S.win,t=$('#rt');if(!t||!w)return;t.textContent='Terminación '+pad(w.n);
  $('#rw').innerHTML='<div class="gordo">'+pad(w.n)+'</div><p>'+winText()+(w.e==='pagado'?' Premio: '+esc(S.cfg.premio):'')+(S.mios[w.n]?'<br><b>¡Es tu número!</b>':'')+'</p>';$('#rS').hidden=true;$('#rX').hidden=false;$('#rX').onclick=closeDlg;
  if(w.e!=='libre'){Snd.fanfare();Conf.burst(innerWidth*.25,innerHeight*.4,80);setTimeout(function(){Conf.burst(innerWidth*.75,innerHeight*.4,80)},350)}else Snd.err()}
 sp.forEach(function(s,i){var iv=setInterval(function(){s.textContent=Math.floor(Math.random()*10);Snd.tick()},75);revT.push(iv);revT.push(setTimeout(function(){clearInterval(iv);s.textContent=g[i];s.classList.add('stop');Snd.stopDigit(i>=3);if(i===sp.length-1)revT.push(setTimeout(fin,700))},1300+i*750))});
 $('#rS').onclick=fin}

/* admin */
function loginDlg(){dlg('<h3>Menú de admin</h3><form id="fl" novalidate><label for="lP">Contraseña</label><input class="in" id="lP" type="password" autocomplete="current-password"><div class="err" id="lE"></div><div class="acts"><button class="btn" type="submit" id="lOk">Entrar</button><button class="btn o" type="button" id="lC">Cancelar</button></div></form>');
 $('#lC').onclick=closeDlg;setTimeout(function(){$('#lP').focus()},50);
 $('#fl').onsubmit=function(e){e.preventDefault();$('#lOk').disabled=true;
  api('login',{pass:$('#lP').value}).then(function(j){if(!j.ok){$('#lE').textContent=j.error;$('#lOk').disabled=false;Snd.err();return}
   S.token=j.token;ls.set('sorteo_tok',j.token);S.view='a';Snd.ok();if(document.activeElement)document.activeElement.blur();$('#ov').hidden=true;$('#main').innerHTML='<div class="loading">CARGANDO <i></i><i></i><i></i></div>';loadAdm(true)}).catch(function(){$('#lE').textContent='Sin conexión. Inténtalo otra vez.';$('#lOk').disabled=false})}}
function adm(action,data,msg){S.busy=true;return api(action,data).then(function(j){S.busy=false;if(!j.ok){toast(j.error);Snd.err();return j}
 if(j.n){S.adm=j.n;S.cfg=j.cfg}S.edit=null;if(msg){toast(j.aviso?msg+'. '+j.aviso:msg);Snd.ok()}render();load(false);return j}).catch(function(e){S.busy=false;if(e.message!=='SESION'){toast('Sin conexión. No se ha guardado.');Snd.err()}})}

document.addEventListener('click',function(e){var t=e.target;
 var b=t.closest('.b');if(b&&b.parentNode.id==='bC'){var n=Number(b.dataset.n);if(S.cfg.gordo)return;if(st(n)!=='libre'){Snd.err();toast(S.mios[n]?'Este número ya es tuyo':'El '+pad(n)+' ya está cogido');return}if(S.sel[n]){delete S.sel[n];Snd.unpick()}else{if(Object.keys(S.sel).length>=MAX){toast('Máximo '+MAX+' números por reserva');Snd.err();return}S.sel[n]=1;Snd.pick(Object.keys(S.sel).length)}refreshBoard();return}
 if(b&&b.parentNode.id==='bA'){S.edit=Number(b.dataset.n);Snd.click();render();var ed=$('.edit');if(ed)ed.scrollIntoView({block:'center',behavior:'smooth'});return}
 if(t.id==='bRes'){Snd.click();reservar();return}
 if(t.id==='bRev'){reveal();return}
 var tb=t.closest('.tabs button');if(tb){S.tab=tb.dataset.t;S.edit=null;Snd.click();render();return}
 var a=t.dataset&&t.dataset.a;if(!a)return;var n2=Number(t.dataset.n);
 if(a==='pag')adm('setNum',{n:n2,e:'pagado'},'Número '+pad(n2)+' pagado');
 else if(a==='lib')adm('setNum',{n:n2,e:'libre'},'Número '+pad(n2)+' liberado');
 else if(a==='cancel'){S.edit=null;render()}
 else if(a==='save'){var nn=S.edit;adm('setNum',{n:nn,e:$('#eE').value,nombre:$('#eN').value.trim()||'Sin nombre',tel:$('#eT').value,email:$('#eM').value.trim()},'Número '+pad(nn)+' actualizado')}
 else if(a==='cfg'){var pr=Number($('#fE').value.replace(',','.')),hh=parseInt($('#fH').value,10);if(!(pr>=0)){toast('Escribe un precio válido');Snd.err();return}if(!(hh>0)){toast('Escribe las horas para pagar');Snd.err();return}
  adm('setCfg',{titulo:$('#fT').value.trim()||S.cfg.titulo,empresa:$('#fN').value.trim(),premio:$('#fP').value.trim()||S.cfg.premio,detalle:$('#fD').value.trim(),precio:pr,horas:hh},'Cambios guardados')}
 else if(a==='nologo')adm('setCfg',{logo:''},'Logo quitado');
 else if(a==='gordo'){var g=$('#fG').value.replace(/\D/g,'');if(!g){$('#gErr').textContent='Escribe las cifras del Gordo.';Snd.err();return}while(g.length<5)g='0'+g;
  adm('setGordo',{gordo:g}).then(function(j){if(j&&j.ok)return api('estado').then(function(x){applyEstado(x,true);S.view='c';render();reveal()})})}
 else if(a==='nogordo')adm('setGordo',{gordo:''},'Resultado borrado');
 else if(a==='pass'){var pw=$('#fW').value;if(pw.length<6){$('#wErr').textContent='Mínimo 6 caracteres.';Snd.err();return}adm('setPass',{nueva:pw}).then(function(j){if(j&&j.ok){toast('Contraseña cambiada');Snd.ok()}})}
 else if(a==='reset'){if($('#fR').value!=='BORRAR'){$('#rErr').textContent='Escribe BORRAR para confirmar.';Snd.err();return}adm('reset',{confirm:'BORRAR'},'Sorteo reiniciado')}
 else if(a==='salir'){api('logout').catch(function(){});S.token='';ls.set('sorteo_tok','');S.view='c';S.adm=null;render()}
});

/* logo: se elige de la galería, se revisa el tamaño y se ajusta a un cuadrado */
var LOGO_PX=256;
function logoBox(){var c=S.cfg,L=S.lp;
 var h='<div class="lbl">Logo de tu empresa</div><div class="tip"><b>Tamaño recomendado:</b> imagen cuadrada de <b>500 × 500 px</b> (mínimo 200 × 200), en PNG con fondo transparente o blanco. Si no es cuadrada, aquí mismo eliges cómo ajustarla.</div>';
 if(!L){h+='<div class="lgrow"><div class="logo big">'+(c.logo?logoH():'<div class="ph-size"><b>500 × 500</b>píxeles</div>')+'</div><div class="lgbtns"><label class="btn" style="margin:0;cursor:pointer">'+(c.logo?'Cambiar logo':'Elegir imagen de la galería')+'<input type="file" id="fF" accept="image/*" hidden></label>'+(c.logo?'<button class="btn o sm" type="button" data-a="nologo">Quitar logo</button>':'')+'</div></div><p class="muted">Se ve arriba del décimo, al lado del título.</p>';return h}
 var sq=Math.max(L.w,L.h)/Math.min(L.w,L.h)<1.15,small=Math.min(L.w,L.h)<200,msg,cls;
 if(small){msg='Tu imagen mide '+L.w+' × '+L.h+' px. Es pequeña y puede verse borrosa. Mejor una de 500 × 500 px.';cls='warn'}
 else if(!sq){msg='Tu imagen mide '+L.w+' × '+L.h+' px. No es cuadrada: elige si quieres verla entera o recortada al centro.';cls='warn'}
 else{msg='Tu imagen mide '+L.w+' × '+L.h+' px. Tamaño perfecto.';cls='okk'}
 h+='<div class="'+cls+'">'+msg+'</div><div class="lgrow"><div class="logo big"><img alt="Vista previa del logo" src="'+L.out+'"></div><div class="lgbtns">'
  +(sq?'':'<div class="modes"><button type="button" data-a="lpmode" data-m="fit" class="'+(L.mode==='fit'?'on':'')+'">Entera</button><button type="button" data-a="lpmode" data-m="crop" class="'+(L.mode==='crop'?'on':'')+'">Recortada</button></div>')
  +'<button class="btn" type="button" data-a="lpsave">Guardar este logo</button><button class="btn o sm" type="button" data-a="lpcancel">Cancelar</button></div></div><p class="muted">Así se verá en el décimo.</p>';
 return h}
function updLogoBox(){var b=$('#logoBox');if(b)b.innerHTML=logoBox()}
function makeLogo(){var L=S.lp,im=L.img,cv=document.createElement('canvas'),x=cv.getContext('2d'),sizes=[LOGO_PX,200,160,128],out='';
 for(var i=0;i<sizes.length;i++){var P=sizes[i];cv.width=cv.height=P;x.clearRect(0,0,P,P);
  var k=L.mode==='crop'?Math.max(P/im.width,P/im.height):Math.min(P/im.width,P/im.height),w=im.width*k,h=im.height*k;
  x.drawImage(im,(P-w)/2,(P-h)/2,w,h);out=cv.toDataURL('image/png');if(out.length<45000)break;
  var wb=cv.toDataURL('image/webp',.85);if(wb.indexOf('data:image/webp')===0&&wb.length<45000){out=wb;break}
  var c2=document.createElement('canvas');c2.width=c2.height=P;var y=c2.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,P,P);y.drawImage(cv,0,0);out=c2.toDataURL('image/jpeg',.85);if(out.length<45000)break}
 L.out=out;L.ok=out.length<45000}
document.addEventListener('change',function(e){if(e.target.id!=='fF'||!e.target.files[0])return;var f=e.target.files[0],r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var sq=Math.max(im.width,im.height)/Math.min(im.width,im.height)<1.15;S.lp={img:im,w:im.width,h:im.height,mode:sq?'crop':'fit'};makeLogo();updLogoBox()};im.onerror=function(){toast('No se puede leer esa imagen. Prueba con una foto JPG o PNG.')};im.src=r.result};r.readAsDataURL(f)});
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
 if(a==='lpmode'){S.lp.mode=t.dataset.m;makeLogo();updLogoBox();Snd.click()}
 else if(a==='lpcancel'){S.lp=null;updLogoBox()}
 else if(a==='lpsave'){if(!S.lp.ok){toast('No se ha podido reducir la imagen. Prueba con otra.');return}var out=S.lp.out;t.disabled=true;t.textContent='Guardando…';adm('setCfg',{logo:out},'Logo guardado').then(function(){S.lp=null;updLogoBox()})}
});

 else dlg('<h3>Instalar la app</h3><div class="ios"><p>Abre el menú del navegador (los tres puntos) y elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</p></div><div class="acts"><button class="btn" type="button" id="iK">Entendido</button></div>');

 if(navigator.share){navigator.share({title:document.title,text:txt,url:url}).catch(function(){});return}
 dlg('<h3>Compartir</h3><div class="share"><a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt+' '+url)+'">WhatsApp</a><a target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt)+'">Telegram</a><a href="mailto:?subject='+encodeURIComponent(document.title)+'&body='+encodeURIComponent(txt+' '+url)+'">Correo</a><button type="button" id="sCp">Copiar enlace</button></div><div class="acts"><button class="btn o" type="button" id="sK">Cerrar</button></div>');
 $('#sK').onclick=closeDlg;$('#sCp').onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){toast('Enlace copiado')}).catch(function(){prompt('Copia el enlace',url)})}};

if('serviceWorker' in navigator){var hadSW=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update()}).catch(function(){});navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSW&&!window._rl){window._rl=1;location.reload()}})}
setInterval(cd,1000);
load(true);
})();
